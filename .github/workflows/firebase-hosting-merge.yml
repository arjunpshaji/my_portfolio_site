# Deploy to Firebase Hosting on merge to web-deploy branch
name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - web-deploy

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "cvLink=${{ secrets.CV_LINK }}" > .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href="/"
          cp .env build/web/
          mkdir -p build/web/assets
          cp .env build/web/assets/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYWEBPAGE_204A6 }}
          channelId: live
          projectId: mywebpage-204a6
